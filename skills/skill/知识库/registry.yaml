# 知识库元数据注册表（唯一元数据源 / single source of truth）
#
# 用途：为每个知识专题提供机器可读的 id / 分类 / 用途 / 触发信号 / 输入输出 / 关联，
#       供 AI 检索路由与人工索引生成使用。
# 维护：
#   - 新增专题必须在本文件登记，再运行 `python3 tests/sync_knowledge_meta.py`
#     把元数据同步进文件 frontmatter，最后运行 `python3 tests/validate_structure.py` 校验。
#   - 本文件的 topics.file 集合必须与实际目录文件集合完全一致，校验脚本会强制比对。
#   - 物理文件名保持扁平不变，以兼容 `给朋友的提示词.txt` 移交脚本与 `打穿短表.md` 的裸文件名指针。

schema: 1
last_reviewed: '2026-09'

status_legend:
  current: '已按 2025-2026 标准或研究复核，可作为当前主线'
  mixed: '主体仍有效，但需结合目标版本与实现判断'
  legacy: '旧系统兼容与历史理解，不作为现代默认方案'
  disabled: '项目明确停用，仅保留技术资料，不进入默认路由'

categories:
  recon:
    name: '侦察与资产发现'
    intent: '在进入具体测试前确认资产、接口、对象与暴露面'
  auth:
    name: '认证与会话'
    intent: '登录、凭据、令牌与认证链的完整性与可绕过性'
  access:
    name: '授权与接口安全'
    intent: '对象/租户/方法级授权边界与接口模型'
  injection:
    name: '注入与解析'
    intent: '可控数据进入解析器、执行器或文件系统导致的越界'
  client:
    name: '客户端与浏览器'
    intent: '浏览器侧信任边界、跨站行为与前端防御架构'
  protocol:
    name: '协议与传输'
    intent: '协议解析差异、长连接与传输层信任边界'
  logic:
    name: '业务逻辑与状态机'
    intent: '业务流程的状态迁移、不变量与并发正确性'
  platform:
    name: '现代应用与基础设施'
    intent: '框架、缓存、云原生与 AI 平台的专项边界'
  method:
    name: '方法与索引'
    intent: '跨专题的检索入口、规避手法与候选筛选方法'
  disabled:
    name: '停用'
    intent: '项目明确不挖不写、仅保留技术资料'

